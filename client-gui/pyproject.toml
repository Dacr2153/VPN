[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "vpnforge-client"
version = "0.1.0"
description = "VPNForge desktop client — PySide6 GUI for the vpnd daemon"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "VPNForge" }]

dependencies = [
    "PySide6>=6.6.0",
    "grpcio>=1.60.0",
    "grpcio-tools>=1.60.0",
    "protobuf>=4.25.0",
    "PySide6-Charts>=6.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-qt>=4.2",
    "mypy>=1.8",
]

[project.scripts]
vpnforge-client = "vpnforge_client:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["vpnforge_client*"]
